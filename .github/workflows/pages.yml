name: Publish Doom website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node site/restore-stock/test_restore.mjs
      - run: node tests/site_installer_test.mjs
      - run: node tests/midi_discovery_test.mjs
      - run: node tests/verify_boot_test.mjs
      - run: cc -std=c11 -O2 -DCMAP256 -DDP_CAMPAIGN -DDP_NATIVE_ART -Ithird_party/doomgeneric/doomgeneric -Isrc/common -Isrc/native tests/native_frame_test.c src/native/doomgeneric_native.c -o /tmp/native-frame-test && /tmp/native-frame-test
      - run: cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/common tests/music_test.c src/common/music.c src/common/sfx.c -o /tmp/music-test && /tmp/music-test
      - run: cc -std=c11 -O2 -Isrc/common tests/sfx_test.c src/common/music.c src/common/sfx.c -o /tmp/sfx-test && /tmp/sfx-test
      - run: cc -std=c11 -O1 -g -fsanitize=address,undefined tests/audio_worker_test.c -o /tmp/audio-worker-test && /tmp/audio-worker-test
      - run: cc -std=c11 -O1 -g -fsanitize=address,undefined tests/audio_pipeline_test.c -o /tmp/audio-pipeline-test && /tmp/audio-pipeline-test
      - run: python3 tests/runtime_status_test.py
      - run: python3 tests/fm1_recovery_test.py
      - run: cc -std=c11 -O2 -DTEST_PUBLIC -Isrc/native/hal tests/usb_smk37_update_test.c -o /tmp/usb-smk-test && /tmp/usb-smk-test
      - run: cc -std=c11 -O2 -Isrc/native/hal -DT_CDC=0 -DT_UAC=0 -DT_LAYOUT=0 -DT_ON=0 tests/usb_desc_test.c -o /tmp/usb-desc-test && /tmp/usb-desc-test
      - run: node tests/analytics_test.mjs
      - run: python3 tools/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
